services:
  dev-db:
    image: postgres:16
    container_name: wh_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: wh-postgres
    ports:
      - "5435:5432"
    volumes:
      - wh_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wh-postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wh_dev_pgdata: